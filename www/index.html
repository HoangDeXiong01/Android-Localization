<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Android Localization</title>
<style>
:root{--bg:#fff;--fg:#1c1b1f;--card:#f3f1f6;--ac:#5b4bd5;--mut:#6b6874}
@media(prefers-color-scheme:dark){:root{--bg:#141318;--fg:#e6e1e9;--card:#211f26;--ac:#a99cff;--mut:#9a95a3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;background:var(--bg);padding:8px 10px;border-bottom:1px solid var(--card);z-index:2}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row:last-child{margin-bottom:0}
button,select{background:var(--card);color:var(--fg);border:0;border-radius:10px;height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;padding:0 8px}
button.p{background:var(--ac);color:var(--bg)}
button:disabled{opacity:.35}
svg{width:22px;height:22px;fill:currentColor}
input[type=search]{flex:1;min-width:0;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--card);background:var(--card);color:var(--fg);font-size:16px}
#info{flex:1;min-width:0;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pg{font-size:14px;min-width:48px;text-align:center}
.u{background:var(--card);margin:10px;padding:10px 12px;border-radius:12px;border:2px solid transparent}
.u.ch{border-color:var(--ac)}
.h{display:flex;align-items:center;gap:6px}
.id{font-size:12px;color:var(--mut);word-break:break-all}
.u button{height:32px;min-width:32px;padding:0;background:var(--bg)}
.u svg{width:18px;height:18px}
button.on{background:var(--ac)!important;color:var(--bg)!important}
.h{gap:4px;flex-wrap:wrap}
.idw{flex:1 1 90px;min-width:0}
.bt{display:flex;gap:4px;flex:none}
#fn{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}
#tl{max-width:150px;height:36px}
#imp{height:36px}
body.sm .ap,body.sm .hd,body.sm .cx{display:none}
body.sm #fl [data-f=rn],body.sm #fl [data-f=ctx]{display:none}
.cxt{font-size:13px;color:var(--mut);white-space:pre-wrap;word-break:break-word;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--bg)}
#fl{display:none;flex-wrap:wrap}
#fl.show{display:flex}
#fl button{height:32px;font-size:13px}
.src{margin:6px 0;white-space:pre-wrap;word-break:break-word}
textarea{width:100%;min-height:70px;padding:8px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);font:inherit}
#empty{padding:30px;text-align:center;color:var(--mut)}

.idw{margin-bottom:2px}
.bt{margin:6px 0 4px}
.u button{height:34px;min-width:34px}
.src{margin:6px 0 0}
.cnt{font-size:11px;color:var(--mut);text-align:right;margin:2px 2px 4px}
.tw{position:relative;background:var(--bg);border-radius:8px}
.tw textarea{position:relative;display:block;background:transparent;resize:none;overflow:hidden;line-height:1.4;white-space:pre-wrap;overflow-wrap:break-word}
.hl{position:absolute;inset:0;padding:8px;border:1px solid transparent;border-radius:8px;font:inherit;line-height:1.4;white-space:pre-wrap;overflow-wrap:break-word;color:transparent;pointer-events:none;overflow:hidden}
mark{background:none;color:inherit;border-radius:3px}
mark.ph{background:rgba(255,167,38,.38)}
mark.tg{background:rgba(66,165,245,.38)}
mark.es{background:rgba(102,187,106,.42)}
.hl mark{color:transparent}
#cfg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--bg);color:var(--fg);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 4px;font-size:17px}
.dlg label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.dlg input,.dlg select,.dlg textarea{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--card);border:1px solid var(--card);border-radius:10px;padding:0 10px;height:40px}
.dlg textarea{height:90px;padding:8px 10px;resize:vertical}
.kr{display:flex;gap:6px}
.hint{font-size:12px;color:var(--mut);margin-top:10px}
.dr{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.dr button{padding:0 16px}
#fnw{flex:1;min-width:0}
#bm,#prog{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.sp{flex:1}
#sw{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none}
.sel,#sa{width:20px;height:20px;accent-color:var(--ac);margin:2px 0 0;flex:none}
#sa{margin:0}
.tp{display:flex;gap:10px;align-items:flex-start}
.tp .idw{flex:1;min-width:0}
.mi{display:flex;align-items:center;justify-content:flex-start;gap:12px;width:100%;height:46px;margin-bottom:4px;background:transparent;font-size:15px;padding:0 8px}
body.sm .mi.x{display:none}
#pt{padding:8px 0;font-size:16px}
</style></head><body>
<header>
<div class="row" id="top"><div id="fnw"><div id="fn">No file</div><div id="info"></div></div><select id="tl" title="Target language" hidden></select><button id="cfgb" title="Auto-translate settings" aria-label="Auto-translate settings"></button><button id="imp" title="Import translations (XLIFF or strings.xml)" aria-label="Import translations" hidden></button></div>
<div class="row">
<button id="open" class="p" title="Open file" aria-label="Open file"></button>
<button id="save" title="Save / Share" aria-label="Save / Share"></button>
<button id="close" title="Close file" aria-label="Close file"></button>
<input id="q" type="search" placeholder="Search"><button id="flt" title="Search in…" aria-label="Search in"></button>
<input id="f" type="file" accept="*/*" hidden><input id="f2" type="file" accept="*/*" hidden></div>
<div class="row" id="fl"><button data-f="id">ID</button><button data-f="rn">Name</button><button data-f="src">Source</button><button data-f="ctx">Context</button><button data-f="tgt">Target</button></div>
<div class="row">
<select id="sz" title="Units per page"><option>10</option><option selected>20</option><option>50</option><option>100</option><option value="0">∞</option></select>
<button id="prev" title="Previous page" aria-label="Previous page"></button>
<span id="pg">–</span>
<button id="next" title="Next page" aria-label="Next page"></button>
<span class="sp"></span><button id="bulk" title="Actions for selected units" aria-label="Actions for selected units" disabled></button><label id="sw" title="Select all shown"><input id="sa" type="checkbox"></label></div>
</header>
<div id="cfg" hidden><div class="dlg">
<h3>Auto-translate</h3>
<label>Engine<select id="c-eng"><option value="free">Free (Google / MyMemory)</option><option value="gemini">Gemini (AI, uses context)</option></select></label>
<div id="gf">
<label>Gemini API key<div class="kr"><input id="c-key" type="password" autocomplete="off" spellcheck="false" placeholder="AIza..."><button id="c-eye" type="button" title="Show / hide key" aria-label="Show or hide key"></button></div></label>
<label>Model<input id="c-model" list="c-models" autocomplete="off" spellcheck="false"></label>
<datalist id="c-models"><option value="gemini-3.6-flash"><option value="gemini-3.8-flash"><option value="gemini-3.5-flash-lite"><option value="gemini-4-argon"></datalist>
<label>Notes for the AI (optional)<textarea id="c-notes" placeholder="e.g. Music player app. Informal tone. Keep 'Playlist' untranslated."></textarea></label>
<div class="hint">The key is stored only on this device and sent only to Google. Get one at aistudio.google.com/apikey</div>
</div>
<div class="dr"><button id="c-test" type="button">Test</button><button id="c-cancel" type="button">Close</button><button id="c-save" type="button" class="p">Save</button></div>
</div></div>
<div id="bm" hidden><div class="dlg"><h3>Selected units</h3><div id="bl"></div><div class="dr"><button id="bclose" type="button">Close</button></div></div></div>
<div id="prog" hidden><div class="dlg"><div id="pt"></div><div class="dr"><button id="pstop" type="button">Stop</button></div></div></div>
<div id="list"></div>
<script>
const $=id=>document.getElementById(id);
const IC={
open:'M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z',
save:'M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10z',

undo:'M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62A7.96 7.96 0 0 1 12.5 10c3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z',
flt:'M10 18h4v-2h-4zM3 6v2h18V6zm3 7h12v-2H6z',
check:'M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
help:'M11 18h2v-2h-2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z',
eye:'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
eyeoff:'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78 3.15 3.15.02-.16c0-1.66-1.34-3-3-3z',

cfg:'M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z',
bulk:'M22 7h-9v2h9V7zm0 8h-9v2h9v-2zM5.54 11 2 7.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 11zm0 8L2 15.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 19z',
prev:'M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z',
next:'M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z'};
const ic=k=>'<svg viewBox="0 0 24 24"><path d="'+IC[k]+'"/></svg>';
['open','save','close','prev','next','flt','imp','cfg','bulk'].forEach(k=>$(k==='cfg'?'cfgb':k).innerHTML=ic(k));

let shown=[],doc=null,raw='',name='file.xlf',units=[],page=0,size=20,pages=1,crowdin=false,mode='xliff';
const F={id:1,rn:1,src:1,ctx:1,tgt:1};
const ga=(t,n)=>{const r=new RegExp('\\s'+n+'=(?:"([^"]*)"|\'([^\']*)\')').exec(t);return r?(r[1]!==undefined?r[1]:r[2]):null};
const setAttr=(t,n,v)=>{const re=new RegExp('(\\s'+n+'=)(?:"[^"]*"|\'[^\']*\')');
  return re.test(t)?t.replace(re,'$1"'+v+'"'):t.replace(/\s*(\/?>)$/,' '+n+'="'+v+'"$1')};
const START=/^<(?:trans-unit|unit)\b(?:"[^"]*"|'[^']*'|[^>"'])*>/;
const setAp=(u,n)=>{if(n===u.oAp)delete u.ap;else u.ap=n};
const setTr=(u,n)=>{if(n===u.oTr)delete u.tr;else u.tr=n};
const changed=u=>u.val!==undefined||u.ap!==undefined||u.tr!==undefined;
const byLocal=(p,n)=>[...p.children].find(c=>c.localName===n);
const cur=u=>u.val!==undefined?u.val:u.rt;
const edited=()=>units.filter(changed).length;
const setVal=(u,v)=>{if(v===u.rt)delete u.val;else u.val=v};

const DEFMODEL='gemini-3.6-flash';
const CFG={eng:'free',gkey:'',gmodel:DEFMODEL,gnotes:''};
try{Object.assign(CFG,JSON.parse(localStorage.getItem('cfg')||'{}'))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('cfg',JSON.stringify(CFG))}catch(e){}};
const engName=()=>CFG.eng==='gemini'?'Gemini':'Google';
const LANGS=[['vi','Vietnamese'],['en','English'],['zh-CN','Chinese (Simplified)'],['zh-TW','Chinese (Traditional)'],['ja','Japanese'],['ko','Korean'],['fr','French'],['de','German'],['es','Spanish'],['pt','Portuguese'],['ru','Russian'],['it','Italian'],['id','Indonesian'],['th','Thai'],['tr','Turkish'],['ar','Arabic'],['hi','Hindi'],['nl','Dutch'],['pl','Polish'],['uk','Ukrainian'],['ms','Malay']];
$('tl').innerHTML=LANGS.map(l=>'<option value="'+l[0]+'">'+l[0]+' – '+l[1]+'</option>').join('');
try{const v=localStorage.getItem('tl');if(v&&LANGS.some(l=>l[0]===v))$('tl').value=v}catch(e){}
$('tl').onchange=()=>{try{localStorage.setItem('tl',$('tl').value)}catch(e){}};
function setMode(m){
  mode=m;document.body.classList.toggle('sm',m==='strings');
  $('tl').hidden=m!=='strings';
  document.querySelector('#fl [data-f=id]').textContent=m==='strings'?'Key':'ID';
}
function parseStrings(txt){
  const t=txt.replace(/<!--[\s\S]*?-->/g,'');
  const res=[];const re=/<(string-array|plurals|string)(?=[\s>\/])([^>]*?)(?:\/>|>([\s\S]*?)<\/\1>)/g;let m;
  const add=(kind,name,sub,rs)=>res.push({kind,name,sub,rs,id:name,rn:kind==='p'?sub:kind==='a'?'['+sub+']':'',
    rt:'',is12:false,oAp:false,oTr:'yes',ctx:[],ct:'',idx:res.length});
  while((m=re.exec(t))){
    const at=' '+m[2],name=ga(at,'name');
    if(!name||ga(at,'translatable')==='false')continue;
    const body=m[3]||'';
    if(m[1]==='string')add('s',name,'',body);
    else{const ir=/<item\b([^>]*)>([\s\S]*?)<\/item>/g;let im,i=0;
      while((im=ir.exec(body)))add(m[1]==='plurals'?'p':'a',name,m[1]==='plurals'?(ga(' '+im[1],'quantity')||'other'):String(i++),im[2])}
  }
  return res;
}
const skey=u=>u.kind+'|'+u.name+'|'+u.sub;
function buildStrings(){
  const L=['<?xml version="1.0" encoding="utf-8"?>','<resources>'];
  const has=v=>v.trim()!=='';
  for(let i=0;i<units.length;){
    const u=units[i];let j=i;
    while(j<units.length&&units[j].kind===u.kind&&units[j].name===u.name)j++;
    const g=units.slice(i,j);i=j;
    if(u.kind==='s'){if(has(cur(u)))L.push('    <string name="'+u.name+'">'+cur(u)+'</string>')}
    else if(u.kind==='p'){const it=g.filter(x=>has(cur(x)));
      if(it.length){L.push('    <plurals name="'+u.name+'">');
        it.forEach(x=>L.push('        <item quantity="'+x.sub+'">'+cur(x)+'</item>'));L.push('    </plurals>')}}
    else if(g.some(x=>has(cur(x)))){L.push('    <string-array name="'+u.name+'">');
      g.forEach(x=>L.push('        <item>'+(has(cur(x))?cur(x):x.rs)+'</item>'));L.push('    </string-array>')}
  }
  L.push('</resources>','');return L.join('\n');
}
const ckey=u=>u.kind==='s'?u.name:u.kind==='p'?u.name+':'+u.sub:u.name+'['+u.sub+']';
const grabTag=(b,n)=>{const r=new RegExp('<'+n+'\\b[^>]*?(?:\\/>|>([\\s\\S]*?)<\\/'+n+'>)').exec(b);return r?(r[1]||''):''};
function readTranslations(txt){
  const d=new DOMParser().parseFromString(txt,'application/xml');
  if(d.querySelector('parsererror'))return null;
  const mp=new Map();
  if(d.documentElement.localName==='resources'){
    parseStrings(txt).forEach(x=>{if(x.rs.trim())mp.set(ckey(x),x.rs)});
  }else{
    const re=/<(trans-unit|unit)\b[\s\S]*?<\/\1>/g;let m;
    while((m=re.exec(txt))){
      const b=m[0],st=START.exec(b),tg=st?st[0]:'';
      const k=ga(tg,'resname')||ga(tg,'name')||ga(tg,'id'),v=grabTag(b,'target');
      if(k&&v.trim()&&!mp.has(k))mp.set(k,v);
    }
  }
  return mp;
}
$('imp').onclick=()=>$('f2').click();
$('f2').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';if(!file||!doc)return;
  const mp=readTranslations(await file.text());
  if(!mp){alert('Not a valid XLIFF or strings.xml file');return}
  const kOf=u=>mode==='strings'?ckey(u):(mp.has(u.rn)?u.rn:u.id);
  const hits=[],matched=new Set();
  units.forEach(u=>{const k=kOf(u);if(mp.has(k)){hits.push([u,mp.get(k)]);matched.add(k)}});
  const conflicts=hits.filter(([u,v])=>cur(u).trim()&&cur(u)!==v).length;
  const over=conflicts>0&&confirm(conflicts+' units already have a different translation. OK = overwrite them, Cancel = fill empty ones only.');
  let n=0;
  hits.forEach(([u,v])=>{if(cur(u)===v)return;if(cur(u).trim()&&!over)return;setVal(u,v);n++});
  const skipped=mp.size-matched.size;
  alert('Imported '+n+(skipped?', skipped '+skipped+(mode==='strings'?' not in source':' with no match'):''));
  render();
};
const gfShow=()=>{$('gf').hidden=$('c-eng').value!=='gemini'};
function openCfg(){
  $('c-eng').value=CFG.eng;$('c-key').value=CFG.gkey;$('c-model').value=CFG.gmodel||DEFMODEL;$('c-notes').value=CFG.gnotes;
  $('c-key').type='password';gfShow();$('cfg').hidden=false;
}
function applyCfg(){
  CFG.eng=$('c-eng').value;CFG.gkey=$('c-key').value.trim();CFG.gmodel=$('c-model').value.trim()||DEFMODEL;CFG.gnotes=$('c-notes').value;
  saveCfg();
}
$('c-eye').innerHTML=ic('eye');
$('c-eye').onclick=()=>{const k=$('c-key');k.type=k.type==='password'?'text':'password'};
$('c-eng').onchange=gfShow;
$('cfgb').onclick=openCfg;
$('c-cancel').onclick=()=>{$('cfg').hidden=true};
$('c-save').onclick=()=>{applyCfg();$('cfg').hidden=true;render()};
$('c-test').onclick=async()=>{
  applyCfg();
  if(CFG.eng!=='gemini'){alert('Select the Gemini engine to test it');return}
  if(!CFG.gkey){alert('Enter your Gemini API key first');return}
  const b=$('c-test');b.disabled=true;
  try{const t=await gemini('Hello, %s!',{id:'test',rn:'',ctx:[]},'en',lc($('tl').value)||'vi');alert('OK: '+t)}
  catch(e){alert('Failed: '+e.message)}

const BM=[['mt','Machine translate selected','mt',0],['check','Approve selected','ap',1],['close','Unapprove selected','un',1],['eyeoff','Hide selected','hd',1],['eye','Unhide selected','sh',1],['copy','Copy source to selected','cs',0],['close','Clear selection','cl',0]];

$('bl').querySelectorAll('.mi').forEach(b=>b.onclick=()=>{$('bm').hidden=true;bulk(b.dataset.a)});
$('bulk').onclick=()=>{$('bm').hidden=false};
$('bclose').onclick=()=>{$('bm').hidden=true};
$('sa').onchange=()=>{const v=$('sa').checked;shown.forEach(u=>u.sel=v);document.querySelectorAll('.u .sel').forEach(c=>c.checked=v);upd()};
async function bulkMT(sel){
  const todo=sel.filter(u=>u.rs.trim());
  if(CFG.eng==='gemini'&&!CFG.gkey.trim()){alert('Enter your Gemini API key in the settings first');openCfg();return}
  const have=todo.filter(u=>cur(u).trim()).length;
  let list=todo;
  if(have&&!confirm(have+' selected units already have a translation. OK = overwrite them, Cancel = translate empty ones only.'))list=todo.filter(u=>!cur(u).trim());
  if(!list.length){alert('Nothing to translate');return}
  let stop=false,done=0,warn=0,err=null;
  $('pstop').onclick=()=>{stop=true;$('pt').textContent='Stopping...'};
  $('prog').hidden=false;
  for(const u of list){
    if(stop)break;
    $('pt').textContent='Translating '+(done+1)+' / '+list.length+' ('+engName()+')';
    try{const r=await machine(u.rs,u);setVal(u,r.text);if(r.warn)warn++;done++}
    catch(e){err=e.message;break}
  }
  $('prog').hidden=true;
  alert('Translated '+done+' / '+list.length+(warn?', '+warn+' to review (placeholders differ)':'')+(err?'. Stopped: '+err:stop?'. Stopped by you':''));
  render();
}
async function bulk(a){
  const sel=units.filter(u=>u.sel);
  if(!sel.length)return;
  if(a==='cl'){sel.forEach(u=>delete u.sel);render();return}
  if(a==='mt'){await bulkMT(sel);return}
  if(a==='cs'){
    const diff=sel.filter(u=>cur(u).trim()&&cur(u)!==u.rs).length;
    if(diff&&!confirm('Replace '+diff+' existing translations with the source text?'))return;
    sel.forEach(u=>setVal(u,u.rs));
  }else{
    sel.forEach(u=>{if(!u.is12)return;
      if(a==='ap')setAp(u,true);else if(a==='un')setAp(u,false);
      else if(a==='hd')setTr(u,'no');else if(a==='sh')setTr(u,'yes')});
  }
  render();
}

$('f').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  const txt=await file.text();
  const d=new DOMParser().parseFromString(txt,'application/xml');
  if(d.querySelector('parsererror')){alert('Invalid XML file');e.target.value='';return}
  if(d.documentElement.localName==='resources'){
    name=file.name;raw=txt;doc=d;page=0;$('q').value='';units=parseStrings(txt);
    setMode('strings');render();e.target.value='';return}
  setMode('xliff');
  name=file.name;raw=txt;doc=d;units=[];page=0;$('q').value='';
  let k=0;
  doc.querySelectorAll('*').forEach(el=>{
    if(el.localName==='trans-unit'||el.localName==='unit'){
      const idx=k++;let host=el;
      if(el.localName==='unit'){host=byLocal(el,'segment')||el}
      if(!byLocal(host,'source'))return;
      units.push({host,idx,id:el.getAttribute('id')||''});
    }});
  crowdin=/tool-id="crowdin"|tool-name="crowdin"/i.test(raw);
  const st=[];const re=/<(trans-unit|unit)\b/g;let m;
  while((m=re.exec(raw)))st.push([m.index,m[1]]);
  const grab=(b,n)=>{const r=new RegExp('<'+n+'\\b[^>]*?(?:\\/>|>([\\s\\S]*?)<\\/'+n+'>)').exec(b);return r?(r[1]||''):''};
  units.forEach(u=>{const[a,tag]=st[u.idx];const e2=raw.indexOf('</'+tag+'>',a);
    const b=raw.slice(a,e2<0?undefined:e2);u.rs=grab(b,'source');u.rt=grab(b,'target');
    const sm=START.exec(b);const stg=sm?sm[0]:'';
    u.is12=tag==='trans-unit';u.rn=ga(stg,'resname')||ga(stg,'name')||'';
    u.oAp=ga(stg,'approved')==='yes';u.oTr=ga(stg,'translate')==='no'?'no':'yes';
    u.ctx=[];const cr=/<context(?=[\s>])([^>]*)>([\s\S]*?)<\/context>/g;let cm;
    while((cm=cr.exec(b)))u.ctx.push((ga(cm[1],'context-type')||'context')+': '+cm[2]);
    u.ct=crowdin?u.ctx.join('\n'):''});
  render();e.target.value='';
};

const hesc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pcls=m=>m[0]==='%'||m[0]==='{'?'ph':(m[0]==='<'||m[0]==='&')?'tg':'es';
function hlight(t){
  let out='',last=0;
  t.replace(TOK,(m,off)=>{out+=hesc(t.slice(last,off))+'<mark class="'+pcls(m)+'">'+hesc(m)+'</mark>';last=off+m.length;return m});
  return out+hesc(t.slice(last));
}
const clen=t=>[...t].length;
function card(u){
  const d=document.createElement('div');d.className='u';
  d.innerHTML='<div class="tp"><input type="checkbox" class="sel" title="Select"><div class="idw"><div class="id"></div><div class="id rn"></div></div></div><div class="bt"><button class="ap"></button><button class="hd"></button><button class="cx"></button><button class="mt"></button><button class="cp"></button><button class="un"></button></div><div class="cxt" hidden></div><div class="src"></div><div class="cnt sc"></div><div class="tw"><div class="hl"></div><textarea></textarea></div><div class="cnt tc"></div>';
  const q=s=>d.querySelector(s);
  const mtb=q('.mt'),ap=q('.ap'),hd=q('.hd'),cx=q('.cx'),cp=q('.cp'),un=q('.un'),cxt=q('.cxt'),ta=q('textarea'),hl=q('.hl');
  mtb.innerHTML=ic('mt');ap.innerHTML=ic('check');cx.innerHTML=ic('help');cp.innerHTML=ic('copy');un.innerHTML=ic('undo');
  [[ap,'Approve'],[hd,'Visible'],[cx,'Context'],[mtb,'Machine translate · '+engName()],[cp,'Copy source'],[un,'Undo changes']].forEach(([e,t])=>{e.title=t;e.setAttribute('aria-label',t)});
  const cb=q('.sel');cb.checked=!!u.sel;cb.onchange=()=>{u.sel=cb.checked;upd()};
  q('.id').textContent=u.id;q('.rn').textContent=u.rn;q('.rn').hidden=!u.rn;
  q('.src').innerHTML=hlight(u.rs);
  q('.sc').textContent=clen(u.rs)+' chars';
  cxt.textContent=crowdin?(u.ctx.join('\n')||'No context'):'For Crowdin Only';
  const fit=()=>{ta.style.height='auto';ta.style.height=Math.max(70,ta.scrollHeight+2)+'px'};
  const paint=()=>{hl.innerHTML=hlight(ta.value)+' ';q('.tc').textContent=clen(ta.value)+' chars'};
  const setText=v=>{ta.value=v;paint();fit()};
  ta.value=cur(u);paint();
  const refresh=()=>{
    const a=u.ap!==undefined?u.ap:u.oAp,t=u.tr!==undefined?u.tr:u.oTr;
    d.classList.toggle('ch',changed(u));un.disabled=!changed(u);
    ap.classList.toggle('on',a);ap.title=a?'Approved':'Not approved';
    hd.innerHTML=ic(t==='yes'?'eye':'eyeoff');hd.classList.toggle('on',t==='yes');
    hd.title=t==='yes'?'translate=yes (tap to hide)':'translate=no (tap to unhide)';
    ap.disabled=hd.disabled=!u.is12;
    cx.classList.toggle('on',!!u.showCtx);cxt.hidden=!u.showCtx;
  };
  const sync=()=>{refresh();upd()};
  ta.oninput=()=>{setVal(u,ta.value);paint();fit();sync()};
  cp.onclick=()=>{setText(u.rs);setVal(u,u.rs);sync()};
  un.onclick=()=>{setText(u.rt);delete u.val;delete u.ap;delete u.tr;sync()};
  ap.onclick=()=>{setAp(u,!(u.ap!==undefined?u.ap:u.oAp));sync()};
  hd.onclick=()=>{setTr(u,(u.tr!==undefined?u.tr:u.oTr)==='yes'?'no':'yes');sync()};
  mtb.onclick=async()=>{
    if(!u.rs.trim())return;
    if(u.val!==undefined&&!confirm('Replace your edit with machine translation?'))return;
    if(CFG.eng==='gemini'&&!CFG.gkey.trim()){alert('Enter your Gemini API key in the settings first');openCfg();return}
    mtb.disabled=true;mtb.classList.add('on');
    try{const r=await machine(u.rs,u);setText(r.text);setVal(u,r.text);
      if(r.warn)alert(r.msg)}
    catch(e){alert('Translation failed: '+e.message)}
    mtb.classList.remove('on');mtb.disabled=false;sync()};
  cx.onclick=()=>{u.showCtx=!u.showCtx;refresh()};
  refresh();d._fit=fit;
  return d;
}
function render(){
  const L=$('list');L.innerHTML='';
  if(!doc){shown=[];L.innerHTML='<div id="empty">Tap the folder icon to open an .xlf / .xliff file</div>';pages=1;page=0;upd();return}
  const q=$('q').value.toLowerCase();
  const hit=(v)=>(v||'').toLowerCase().includes(q);
  const f=units.filter(u=>!q||(F.id&&hit(u.id))||(F.rn&&hit(u.rn))||(F.src&&hit(u.rs))||(F.ctx&&hit(u.ct))||(F.tgt&&hit(cur(u))));
  pages=size>0?Math.max(1,Math.ceil(f.length/size)):1;
  if(page>=pages)page=pages-1;
  const part=size>0?f.slice(page*size,page*size+size):f;
  shown=part;
  if(!part.length)L.innerHTML='<div id="empty">No matches</div>';
  part.forEach(u=>{const c=card(u);L.appendChild(c);c._fit()});
  upd();
}
function upd(){
  $('fn').textContent=doc?name:'No file';
  $('imp').hidden=!doc;
  const nsel=units.filter(x=>x.sel).length;
  $('info').textContent=!doc?'':(mode==='strings'?`${units.filter(u=>cur(u).trim()).length} / ${units.length} done`:`${edited()} edited / ${units.length}`)+(nsel?` · ${nsel} selected`:'');
  $('bulk').disabled=!nsel;
  const sc=shown.filter(x=>x.sel).length;
  $('sa').checked=shown.length>0&&sc===shown.length;$('sa').indeterminate=sc>0&&sc<shown.length;$('sa').disabled=!shown.length;
  $('pg').textContent=doc&&size>0?`${page+1}/${pages}`:'–';
  $('prev').disabled=!doc||size===0||page<=0;
  $('next').disabled=!doc||size===0||page>=pages-1;
}

const lc=c=>{if(!c||c==='auto')return c;const l=c.toLowerCase();
  if(l.startsWith('zh'))return /tw|hk|hant/.test(l)?'zh-TW':'zh-CN';return l.split(/[-_]/)[0]};
function langs(){
  const ft=/<file\b[^>]*>/.exec(raw),xt=/<xliff\b[^>]*>/.exec(raw);
  const g=(t,n)=>t?ga(t[0],n):null;
  return {sl:lc(g(ft,'source-language')||g(xt,'srcLang')||'auto'),tl:lc(g(ft,'target-language')||g(xt,'trgLang'))};
}
const TOK=/%(?:\d+\$)?[-#+ 0,(]*\d*(?:\.\d+)?[a-zA-Z%]|\\u[0-9a-fA-F]{4}|\\[nrt'"@?\\]|&(?:#\d+|#x[0-9a-fA-F]+|[a-zA-Z]+);|<[^>]+>|\{[^}]*\}/g;
async function gtx(q,sl,tl){
  const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+sl+'&tl='+tl+'&q='+encodeURIComponent(q));
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();return j[0].map(x=>x[0]).join('');
}
async function mym(q,sl,tl){
  if(q.length>480)throw new Error('Text too long for the fallback service');
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+(sl==='auto'?'en':sl)+'|'+tl);
  const j=await r.json();
  if(!j.responseData||String(j.responseStatus)!=='200')throw new Error(j.responseDetails||'Service error');
  const t=document.createElement('textarea');t.innerHTML=j.responseData.translatedText;return t.value;
}
const lname=c=>{const l=LANGS.find(x=>x[0].toLowerCase()===String(c).toLowerCase());return l?l[1]+' ('+l[0]+')':c};
async function gemini(src,u,sl,tl){
  const sys=['You are a professional software localizer for an Android app. Translate the given UI string.',
    'Rules:',
    '- Output ONLY the translation: no quotes, no notes, no code fences.',
    '- The text is raw XML content. Keep placeholders (%s, %1$d, {name}), escape sequences (\\n, \\\', \\\"), XML entities (&amp; &lt; &gt;) and tags (<b>, <xliff:g ...>) exactly as in the source. Never translate tag names, attributes or placeholders.',
    '- Keep the same line breaks, leading/trailing spaces and punctuation style.',
    '- The key name and context are only hints about meaning and are not to be translated.',
    '- For a plural form, write the correct plural form for the target language.',
    mode==='strings'?'- Apostrophes and double quotes in the output must be escaped as \\\' and \\\" (Android strings.xml).':'',
    CFG.gnotes.trim()?'Extra notes from the app author:\n'+CFG.gnotes.trim():''].filter(Boolean).join('\n');
  const info=['Key: '+(mode==='strings'?u.id:(u.rn||u.id))];
  if(u.kind==='p')info.push('Plural quantity: '+u.sub);
  if(u.kind==='a')info.push('Array item index: '+u.sub);
  if(crowdin&&u.ctx&&u.ctx.length)info.push('Context: '+u.ctx.join('; '));
  const prompt=info.join('\n')+'\n\nSource text'+(sl&&sl!=='auto'?' ('+lname(sl)+')':'')+':\n<<<\n'+src+'\n>>>\n\nTranslate into '+lname(tl)+'. Output only the translation.';
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent((CFG.gmodel||DEFMODEL).trim())+':generateContent';
  const headers={'Content-Type':'application/json','x-goog-api-key':CFG.gkey.trim()};
  const base={system_instruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:prompt}]}]};
  const send=b=>fetch(url,{method:'POST',headers,body:JSON.stringify(b)});
  let r=await send({...base,generationConfig:{thinkingConfig:{thinkingLevel:'low'}}});
  if(r.status===400)r=await send(base);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
  const c=j.candidates&&j.candidates[0];
  let t=c&&c.content&&c.content.parts?c.content.parts.filter(p=>!p.thought).map(p=>p.text||'').join(''):'';
  if(!t.trim())throw new Error(j.promptFeedback&&j.promptFeedback.blockReason?'Blocked: '+j.promptFeedback.blockReason:'Empty response'+(c&&c.finishReason?' ('+c.finishReason+')':''));
  t=t.trim().replace(/^```[a-z]*\n?/i,'').replace(/\n?```$/,'').replace(/^<<<\n?/,'').replace(/\n?>>>$/,'').trim();
  return /^\s*/.exec(src)[0]+t+/\s*$/.exec(src)[0];
}
const tokCount=t=>{const m=new Map();(t.match(TOK)||[]).forEach(x=>m.set(x,(m.get(x)||0)+1));return m};
async function machine(src,u){
  const {sl,tl}=mode==='strings'?{sl:'auto',tl:lc($('tl').value)}:langs();
  if(!tl)throw new Error('Target language not found in file');
  if(src.length>1500)throw new Error('Source too long');
  const quotes=t=>mode==='strings'?t.replace(/(?<!\\)(['"])/g,'\\$1'):t;
  if(CFG.eng==='gemini'){
    const out=quotes(await gemini(src,u,sl,tl));
    const a=tokCount(src),b=tokCount(out);let miss=false;a.forEach((n,k)=>{if((b.get(k)||0)!==n)miss=true});
    const bad=new DOMParser().parseFromString('<r xmlns:xliff="urn:oasis:names:tc:xliff:document:1.2">'+out+'</r>','application/xml').querySelector('parsererror');
    return {text:out,warn:miss||!!bad,msg:bad?'The translation may not be valid XML (check &, < and tags). Please review it.':'Some placeholders differ from the source. Please review the translation.'};
  }
  const toks=[];
  const p=src.replace(TOK,t=>{toks.push(t);return '[['+(toks.length-1)+']]'});
  let out;
  try{out=await gtx(p,sl,tl)}catch(e1){
    try{out=await mym(p,sl,tl)}catch(e2){throw new Error(e1.message+' / '+e2.message)}}
  out=out.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  out=quotes(out);
  const used=new Set();
  out=out.replace(/\[\s*\[\s*(\d+)\s*\]\s*\]/g,(m,i)=>{if(toks[i]===undefined)return m;used.add(i);return toks[i]});
  return {text:out,warn:used.size<toks.length,msg:'Some placeholders may be missing from the translation. Please review it.'};
}

$('save').onclick=async()=>{
  if(!doc){alert('No file open');return}
  let out,outName=name;
  if(mode==='strings'){out=buildStrings();outName='strings-'+$('tl').value+'.xml'}
  else{
  const starts=[];const re=/<(trans-unit|unit)\b/g;let m;
  while((m=re.exec(raw)))starts.push([m.index,m[1]]);
  out=raw;
  const ed=units.filter(changed).sort((x,y)=>y.idx-x.idx);
  for(const u of ed){
    const [st,tag]=starts[u.idx];
    let en=out.indexOf('</'+tag+'>',st);if(en<0)continue;
    let blk=out.slice(st,en);
    if(u.val!==undefined){
    const tre=/<target\b([^>]*?)\s*(?:\/>|>[\s\S]*?<\/target>)/;
    if(tre.test(blk)){
      blk=blk.replace(tre,(_,at)=>'<target'+at+'>'+u.val+'</target>');
    }else{
      blk=blk.replace(/([ \t]*)<source\b[^>]*?(?:\/>|>[\s\S]*?<\/source>)/,
        (x,ind)=>x+'\n'+ind+'<target>'+u.val+'</target>');
    }}
    blk=blk.replace(START,t=>{
      if(u.ap!==undefined)t=setAttr(t,'approved',u.ap?'yes':'no');
      if(u.tr!==undefined)t=setAttr(t,'translate',u.tr);
      return t});
    out=out.slice(0,st)+blk+out.slice(en);
  }
  }
  const chk=new DOMParser().parseFromString(out,'application/xml');
  if(chk.querySelector('parsererror')){alert('Your edits make the XML invalid (e.g. a bare & or < instead of &amp; / &lt;). Not saved.');return}
  try{
    const P=window.Capacitor&&window.Capacitor.Plugins;
    if(P&&P.Filesystem&&P.Share){
      const r=await P.Filesystem.writeFile({path:outName,data:out,directory:'CACHE',encoding:'utf8'});
      await P.Share.share({title:outName,url:r.uri,dialogTitle:'Save XLIFF file'});
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/xml'}));
      a.download=outName;a.click();
    }
  }catch(e){if(!String(e).includes('cancel'))alert('Save failed: '+e)}
};
render();
