name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: "versionCode (positive integer, must increase with each release, e.g. 1)"
        required: true
        default: "1"
        type: string
      sign_apk:
        description: "Sign the APK with the release keystore (off = debug build, signed with the debug key)"
        required: true
        default: true
        type: boolean
      create_release:
        description: "Create a GitHub Release and attach the APK"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  APP_ID: com.hoangdexiong01.localization
  VERSION_NAME: ${{ inputs.version_name }}
  VERSION_CODE: ${{ inputs.version_code }}
  SIGN_APK: ${{ inputs.sign_apk }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate inputs
        run: |
          [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] || { echo "::error::invalid versionName: '$VERSION_NAME'"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] && [ "$VERSION_CODE" -le 2100000000 ] || { echo "::error::versionCode must be an integer from 1 to 2100000000: '$VERSION_CODE'"; exit 1; }

      - name: Check signing secrets
        if: ${{ inputs.sign_apk }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v (Settings > Secrets and variables > Actions). Or re-run with sign_apk turned off."; exit 1; }
          done

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install latest dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npm ls --depth=0

      - name: Build web + create Android project
        run: |
          npm run build:web
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
          node scripts/configure-android.mjs

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$SIGN_APK" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew "$TASK" --no-daemon --stacktrace

      - name: Collect / sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BASE="Localization-${VERSION_NAME}-${VERSION_CODE}"
          if [ "$SIGN_APK" = "true" ]; then
            SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -1)"
            SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p -f 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "dist/${BASE}-signed.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "dist/${BASE}-signed.apk"
            rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"
          else
            cp android/app/build/outputs/apk/debug/*.apk "dist/${BASE}-debug.apk"
          fi
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          FLAGS=""
          [ "$SIGN_APK" = "true" ] || FLAGS="--prerelease"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" \
              --title "Android Localization ${VERSION_NAME}" --generate-notes $FLAGS
          fi
